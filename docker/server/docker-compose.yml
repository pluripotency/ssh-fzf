services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app/config
      - ../../cert:/app/cert
    environment:
      - SERVER_CONFIG_TOML_PATH=/app/config/server_config.toml
      - CERT_PATH=/app/cert
      - HOST=0.0.0.0
